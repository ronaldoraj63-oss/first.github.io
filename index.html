<style>

#score, #level { font-size:18px; font-weight:bold; margin:5px; }
.container { display:flex; justify-content:space-around; margin-top:20px; }
.column { width:40%; }
.word {
    margin:6px; padding:8px; background:white;
    border-radius:6px; cursor:pointer; border:1px solid #ccc;
}
.selected { background:#cce5ff; }
.correct { background:#b6f5b6; pointer-events:none; opacity:0.6; }
.wrong { background:#ffb3b3; }

<body>

let level = 1;
let score = 0;
let selectedGerman = null;
let matchedCount = 0;
let levelWords = [];

function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

function loadLevel(){
matchedCount = 0;
document.getElementById("message").innerText = "";
document.getElementById("level").innerText = "Level: " + level;

let start = (level-1)*10;
levelWords = allWords.slice(start,start+10);

let germanCol=document.getElementById("germanColumn");
let englishCol=document.getElementById("englishColumn");
germanCol.innerHTML=""; englishCol.innerHTML="";

shuffle(levelWords).forEach(w=>{
let d=document.createElement("div");
d.className="word"; d.innerText=w.german;
d.onclick=()=>selectGerman(w,d);
germanCol.appendChild(d);
});

shuffle(levelWords).forEach(w=>{
let d=document.createElement("div");
d.className="word"; d.innerText=w.english;
d.onclick=()=>checkMatch(w,d);
englishCol.appendChild(d);
});
}

function selectGerman(word,el){
if(el.classList.contains("correct"))return;
clearSelection();
selectedGerman={word:word,element:el};
el.classList.add("selected");
}

function checkMatch(word,el){
if(!selectedGerman)return;
if(selectedGerman.word.english===word.english){
selectedGerman.element.classList.add("correct");
el.classList.add("correct");
score++; matchedCount++;
if(matchedCount===10){
document.getElementById("message").innerText="Level Completed!";
}
}else{
el.classList.add("wrong");
setTimeout(()=>el.classList.remove("wrong"),400);
score--;
}
document.getElementById("score").innerText="Score: "+score;
clearSelection(); selectedGerman=null;
}

function clearSelection(){
document.querySelectorAll(".word").forEach(e=>e.classList.remove("selected"));
}

function nextLevel(){
if(level<10){ level++; loadLevel(); }
else{
document.getElementById("message").innerText="🎉 All 100 Words Completed!";
}
}

loadLevel();

</script>
