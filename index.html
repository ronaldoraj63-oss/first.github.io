<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>German B1 Vocabulary Game</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    text-align:center;
}

h1{
    margin-top:20px;
}

#info{
    font-size:18px;
    margin:10px;
    font-weight:bold;
}

.container{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:20px;
}

.column{
    width:40%;
}

.word{
    background:white;
    margin:8px;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
    transition:0.2s;
}

.word:hover{
    background:#dfe6ff;
}

.selected{
    background:#a5b4fc !important;
}

.matched{
    background:#86efac !important;
    pointer-events:none;
}

button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    background:#4f46e5;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#3730a3;
}
</style>
</head>

<body>

<h1>German B1 Vocabulary Game</h1>
<div id="info">
Level: <span id="level">1</span> |
Score: <span id="score">0</span>
</div>

<div class="container">
    <div class="column" id="germanColumn"></div>
    <div class="column" id="englishColumn"></div>
</div>

<button onclick="nextLevel()">Next Level</button>

<script>

// ===== 100 WORDS (10 per level) =====
const vocabulary = [
{de:"rennen", en:"to run"},
{de:"ansprechen", en:"to address"},
{de:"erfinden", en:"to invent"},
{de:"schreien", en:"to scream"},
{de:"vergleichen", en:"to compare"},
{de:"bedeuten", en:"to mean"},
{de:"gehören", en:"to belong"},
{de:"verbessern", en:"to improve"},
{de:"erreichen", en:"to achieve"},
{de:"verstehen", en:"to understand"},

{de:"entscheiden", en:"to decide"},
{de:"erklären", en:"to explain"},
{de:"entwickeln", en:"to develop"},
{de:"beschreiben", en:"to describe"},
{de:"vergessen", en:"to forget"},
{de:"erinnern", en:"to remember"},
{de:"verändern", en:"to change"},
{de:"bestehen", en:"to pass/exist"},
{de:"untersuchen", en:"to examine"},
{de:"erwarten", en:"to expect"},

{de:"bewerben", en:"to apply"},
{de:"erlauben", en:"to allow"},
{de:"ablehnen", en:"to reject"},
{de:"vermeiden", en:"to avoid"},
{de:"verbieten", en:"to forbid"},
{de:"unterstützen", en:"to support"},
{de:"teilnehmen", en:"to participate"},
{de:"vorschlagen", en:"to suggest"},
{de:"vorbereiten", en:"to prepare"},
{de:"zusammenfassen", en:"to summarize"},

{de:"überprüfen", en:"to check"},
{de:"stattfinden", en:"to take place"},
{de:"auswählen", en:"to choose"},
{de:"beantragen", en:"to apply for"},
{de:"kündigen", en:"to resign"},
{de:"einstellen", en:"to hire"},
{de:"bestellen", en:"to order"},
{de:"liefern", en:"to deliver"},
{de:"bezahlen", en:"to pay"},
{de:"erhalten", en:"to receive"},

{de:"verkaufen", en:"to sell"},
{de:"kaufen", en:"to buy"},
{de:"mieten", en:"to rent"},
{de:"vermieten", en:"to rent out"},
{de:"umziehen", en:"to move house"},
{de:"anbieten", en:"to offer"},
{de:"annehmen", en:"to accept"},
{de:"zurückgeben", en:"to return"},
{de:"abholen", en:"to pick up"},
{de:"ausfüllen", en:"to fill out"},

{de:"mitteilen", en:"to inform"},
{de:"überlegen", en:"to think about"},
{de:"verpassen", en:"to miss"},
{de:"stattgeben", en:"to approve"},
{de:"klären", en:"to clarify"},
{de:"hinweisen", en:"to point out"},
{de:"sparen", en:"to save money"},
{de:"ausgeben", en:"to spend"},
{de:"leihen", en:"to lend"},
{de:"zurückzahlen", en:"to repay"},

{de:"träumen", en:"to dream"},
{de:"lächeln", en:"to smile"},
{de:"weinen", en:"to cry"},
{de:"wundern", en:"to wonder"},
{de:"hoffen", en:"to hope"},
{de:"fürchten", en:"to fear"},
{de:"genießen", en:"to enjoy"},
{de:"vermissen", en:"to miss someone"},
{de:"erleben", en:"to experience"},
{de:"beobachten", en:"to observe"},

{de:"sammeln", en:"to collect"},
{de:"zerstören", en:"to destroy"},
{de:"schützen", en:"to protect"},
{de:"retten", en:"to rescue"},
{de:"reparieren", en:"to repair"},
{de:"bauen", en:"to build"},
{de:"produzieren", en:"to produce"},
{de:"verwenden", en:"to use"},
{de:"ersetzen", en:"to replace"},
{de:"verbinden", en:"to connect"},

{de:"trennen", en:"to separate"},
{de:"eröffnen", en:"to open"},
{de:"schließen", en:"to close"},
{de:"steigen", en:"to climb"},
{de:"fallen", en:"to fall"},
{de:"heben", en:"to lift"},
{de:"senken", en:"to lower"},
{de:"drehen", en:"to turn"},
{de:"werfen", en:"to throw"},
{de:"fangen", en:"to catch"},

{de:"beginnen", en:"to begin"},
{de:"enden", en:"to end"},
{de:"wachsen", en:"to grow"},
{de:"sterben", en:"to die"},
{de:"leben", en:"to live"},
{de:"lernen", en:"to learn"},
{de:"lehren", en:"to teach"},
{de:"arbeiten", en:"to work"},
{de:"reisen", en:"to travel"},
{de:"wohnen", en:"to live/reside"}
];

// ===== GAME LOGIC =====
let level = 1;
let score = 0;
let selected = null;
let matches = 0;

function loadLevel(){
    document.getElementById("level").textContent = level;
    matches = 0;
    selected = null;

    const start = (level-1)*10;
    const words = vocabulary.slice(start, start+10);

    const germanColumn = document.getElementById("germanColumn");
    const englishColumn = document.getElementById("englishColumn");
    germanColumn.innerHTML = "";
    englishColumn.innerHTML = "";

    let shuffledEnglish = [...words].sort(()=>Math.random()-0.5);

    words.forEach(word=>{
        let div = document.createElement("div");
        div.className="word";
        div.textContent = word.de;
        div.dataset.match = word.en;
        div.onclick = selectWord;
        germanColumn.appendChild(div);
    });

    shuffledEnglish.forEach(word=>{
        let div = document.createElement("div");
        div.className="word";
        div.textContent = word.en;
        div.dataset.match = word.de;
        div.onclick = selectWord;
        englishColumn.appendChild(div);
    });
}

function selectWord(){
    if(this.classList.contains("matched")) return;

    if(!selected){
        selected = this;
        this.classList.add("selected");
    }else{
        if(selected.dataset.match === this.textContent){
            selected.classList.add("matched");
            this.classList.add("matched");
            score++;
            matches++;
            document.getElementById("score").textContent = score;
        }
        selected.classList.remove("selected");
        selected = null;

        if(matches===10){
            alert("Level Completed!");
        }
    }
}

function nextLevel(){
    if(level<10){
        level++;
        loadLevel();
    }else{
        alert("You completed all 10 Levels!");
    }
}

loadLevel();

</script>

</body>
</html>
